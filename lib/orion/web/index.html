<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ops</title>
<style>
  :root {
    --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --panel: #ffffff; --panel2: #f5f5f4;
    --accent: #2563eb; --ok: #15803d; --bad: #b91c1c; --warn: #b45309; --info: #0e7490;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c0a09; --fg: #e7e5e4; --muted: #a8a29e; --line: #292524; --panel: #1c1917; --panel2: #292524;
      --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --info: #22d3ee;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c0a09; --fg: #e7e5e4; --muted: #a8a29e; --line: #292524; --panel: #1c1917; --panel2: #292524;
    --accent: #60a5fa; --ok: #4ade80; --bad: #f87171; --warn: #fbbf24; --info: #22d3ee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
  header { display: flex; align-items: center; gap: 20px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--muted); font-weight: 400; }
  nav a { padding: 6px 10px; border-radius: 6px; color: var(--fg); }
  nav a.on { background: var(--panel2); font-weight: 600; }
  header .right { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { padding: 16px; max-width: 1280px; margin: 0 auto; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 22px 0 8px; }
  h3 { font-size: 14px; margin: 14px 0 6px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; background: var(--panel2); }
  tr:last-child td { border-bottom: 0; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--panel2); }
  td.num { text-align: right; font-family: var(--mono); }
  .muted { color: var(--muted); }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .info { color: var(--info); }
  .pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; border: 1px solid currentColor; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .card h3 { margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .card .cmd { color: var(--muted); font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 10px; margin: 10px 0; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { font: inherit; font-size: 12.5px; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel2); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  pre.log { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 70vh; white-space: pre-wrap; word-break: break-word; margin: 0; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 8px 0 12px; flex-wrap: wrap; }
  input, select { font: inherit; font-size: 13px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
  .crumb { color: var(--muted); margin-bottom: 8px; }
  .doc h1 { font-size: 18px; } .doc h2 { text-transform: none; letter-spacing: 0; font-size: 15px; color: var(--fg); margin-top: 18px; } .doc h3 { font-size: 14px; }
  .doc pre { background: var(--panel2); padding: 10px; border-radius: 6px; overflow: auto; }
  .doc code { background: var(--panel2); padding: 1px 4px; border-radius: 4px; }
  .doc pre code { background: none; padding: 0; }
  .doc blockquote { border-left: 3px solid var(--line); margin: 8px 0; padding: 2px 12px; color: var(--muted); }
  .doc table { width: auto; }
  .doc table th, .doc table td { padding: 4px 8px; }
  .empty { color: var(--muted); padding: 24px; text-align: center; border: 1px dashed var(--line); border-radius: 8px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.15); max-width: 420px; }
  .section-note { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  .spark { display: inline-flex; gap: 2px; align-items: flex-end; height: 14px; vertical-align: middle; }
  .spark i { display: inline-block; width: 6px; border-radius: 1px; background: var(--muted); }
  @media (max-width: 720px) { main { padding: 12px; } .kv { grid-template-columns: 90px 1fr; } }
</style>
</head>
<body>
<header>
  <h1>ops <span id="root"></span></h1>
  <nav>
    <a href="#scripts" data-tab="scripts">Scripts</a>
    <a href="#runs" data-tab="runs">Runs</a>
    <a href="#schedules" data-tab="schedules">Schedules</a>
  </nav>
  <div class="right" id="status"></div>
</header>
<main id="main"></main>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
// One page, three tabs, hash routes: #scripts · #script/<name> · #runs · #run/<id> · #schedules · #schedule/<name>.
// The data is the API's, polled while a list is on screen; a running run's log is tailed every two seconds.

const $ = (sel, el = document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const main = $("#main");
let timer = null;

async function api(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "x-ops-local": "1", ...(opts.headers || {}) } });
  const type = res.headers.get("content-type") || "";
  const body = type.includes("json") ? await res.json() : await res.text();
  if (!res.ok) throw new Error(typeof body === "string" ? body : body.error + (body.hint ? ` — ${body.hint}` : ""));
  return body;
}

function toast(msg, cls = "") {
  const t = $("#toast");
  t.innerHTML = `<span class="${cls}">${esc(msg)}</span>`;
  t.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (t.hidden = true), 4000);
}

// --- little helpers, the same words the CLI uses ------------------------------

function ago(iso) {
  if (!iso) return "—";
  const ms = Date.now() - new Date(iso).getTime();
  if (ms < 60e3) return "just now";
  if (ms < 86400e3) return human(ms) + " ago";
  const d = Math.floor(ms / 86400e3);
  return d === 1 ? "yesterday" : `${d}d ago`;
}
function human(ms) {
  if (ms == null) return "—";
  const s = Math.round(ms / 1000);
  if (s < 60) return `${s}s`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m${s % 60 ? ` ${s % 60}s` : ""}`;
  const h = Math.floor(m / 60);
  return `${h}h${m % 60 ? ` ${m % 60}m` : ""}`;
}
const STATUS_CLS = { completed: "ok", failed: "bad", cancelled: "warn", interrupted: "warn", running: "info" };
const status = (s) => `<span class="${STATUS_CLS[s] || ""}">${esc(s)}</span>`;
const tierCls = (s) => (s.prod_write ? "bad" : s.tier === "staging" ? "warn" : s.tier === "read-only" ? "ok" : "muted");
const tier = (s) => `<span class="pill ${tierCls(s)}">${esc(s.tier || "?")}</span>`;
const envCell = (env) => `<span class="${env === "production" ? "bad" : "warn"}">${esc(env === "staging" ? "stg" : "prod")}</span>`;
const argsCell = (r) => [...(r.args || []), ...Object.entries(r.params || {}).map(([k, v]) => `-p ${k}=${v}`)].join(" ");

// "Queue empty. Done — 12 record(s) confirmed." — the number a confirm run ends on.
function confirmedIn(text) {
  const m = /(\d+) record\(s\) confirmed/.exec(text || "");
  return m ? Number(m[1]) : null;
}

// --- markdown, just enough for an AGENTS.md ---------------------------------------

function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function markdown(src) {
  const lines = String(src).split("\n");
  const out = [];
  let i = 0;
  const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
  while (i < lines.length) {
    const l = lines[i];
    if (/^```/.test(l)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(l);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${markdown(buf.join("\n"))}</blockquote>`);
      continue;
    }
    if (/^\s*\|/.test(l) && i + 1 < lines.length && isSep(lines[i + 1])) {
      const head = cells(l);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) {
      const ordered = /^\s*\d+\./.test(l);
      const items = [];
      while (i < lines.length && (/^\s*([-*]|\d+\.)\s+/.test(lines[i]) || /^\s{2,}\S/.test(lines[i]))) {
        if (/^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        else items[items.length - 1] += " " + lines[i].trim();
        i++;
      }
      out.push(`<${ordered ? "ol" : "ul"}>${items.map((it) => `<li>${inline(it)}</li>`).join("")}</${ordered ? "ol" : "ul"}>`);
      continue;
    }
    if (!l.trim()) { i++; continue; }
    const buf = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,6}\s|```|\s*>|\s*([-*]|\d+\.)\s|\s*\|)/.test(lines[i])) buf.push(lines[i++]);
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  return out.join("\n");
}

// --- views ---------------------------------------------------------------------

function setTab(name) {
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("on", a.dataset.tab === name));
}

function poll(fn, ms) {
  clearInterval(timer);
  timer = setInterval(() => fn().catch(() => {}), ms);
}

async function viewScripts() {
  setTab("scripts");
  const retired = location.hash.includes("retired");
  const data = await api(`/api/scripts?retired=${retired ? 1 : 0}`);
  $("#root").textContent = data.root;
  const problems = data.problems.filter((p) => p.level === "error").length;
  let html = `<div class="toolbar"><input id="q" placeholder="filter: name, summary, country, integration…" style="flex:1;max-width:420px">
    <label><input type="checkbox" id="ret" ${retired ? "checked" : ""}> show retired</label>
    ${problems ? `<span class="warn">${problems} catalogue problem(s) — ops orion docs check</span>` : ""}</div>`;
  let lastDomain = null;
  for (const g of data.groups) {
    if (g.domain !== lastDomain) { html += `<h2>${esc(g.domain_label)}</h2>`; lastDomain = g.domain; }
    html += `<h3>${esc(g.integration)} <span class="section-note">${g.scripts.length}</span></h3>
      <table class="scripts"><thead><tr><th>Script</th><th>Tier</th><th>Env</th><th>Status</th><th>Summary</th></tr></thead><tbody>`;
    for (const s of g.scripts) {
      html += `<tr class="row" data-q="${esc([s.name, s.summary, s.country, s.integration, s.integrator, s.domain].join(" ").toLowerCase())}" onclick="location.hash='#script/${esc(s.name)}'">
        <td class="mono">${esc(s.name)}</td><td>${tier(s)}</td><td>${envCell(s.env)}</td>
        <td>${s.status_label === "active" ? "" : `<span class="warn">${esc(s.status_label.toUpperCase())}</span>`}</td>
        <td>${esc(s.summary)}${s.prod_write ? ' <span class="bad">· production write</span>' : ""}</td></tr>`;
    }
    html += `</tbody></table>`;
  }
  main.innerHTML = html;
  $("#q").oninput = (e) => {
    const f = e.target.value.toLowerCase();
    document.querySelectorAll("tr.row").forEach((tr) => (tr.style.display = !f || tr.dataset.q.includes(f) ? "" : "none"));
  };
  $("#ret").onchange = (e) => (location.hash = e.target.checked ? "#scripts/retired" : "#scripts");
  clearInterval(timer);
}

async function viewScript(name) {
  setTab("scripts");
  const s = await api(`/api/scripts/${encodeURIComponent(name)}`);
  const runsOf = await api(`/api/runs?script=${encodeURIComponent(name)}&limit=10`);
  const scheds = (await api("/api/schedules")).filter((x) => x.script === name || x.script.startsWith(name + "/"));
  main.innerHTML = `<div class="crumb"><a href="#scripts">Scripts</a> / ${esc(name)}</div>
    <div class="card">
      <h3><span class="mono">${esc(s.name)}</span> ${tier(s)} ${envCell(s.env)} <span class="muted">· ${esc(s.access)}</span>
        ${s.status_label !== "active" ? `<span class="pill warn">${esc(s.status_label)}</span>` : ""}
        ${s.prod_write ? '<span class="bad">⚠ PRODUCTION WRITE</span>' : ""}</h3>
      <div>${esc(s.summary)}</div>
      <div class="kv">
        <div>Domain</div><div>${esc(s.domain_label)}</div>
        ${s.country ? `<div>Country</div><div>${esc(s.country)}</div>` : ""}
        ${s.integration ? `<div>Integration</div><div>${esc(s.integration)}</div>` : ""}
        ${s.integrator ? `<div>Integrator</div><div>${esc(s.integrator)}</div>` : ""}
        <div>Tier</div><div>${esc(s.tier_label || "unknown")}</div>
        ${s.secrets.length ? `<div>Secrets</div><div class="mono">${esc(s.secrets.join(", "))}</div>` : ""}
        ${s.asks ? `<div>Asks</div><div>the script asks the operator itself (asks: true)</div>` : ""}
        ${s.blocked_on ? `<div>Blocked on</div><div>${esc(s.blocked_on)}</div>` : ""}
        ${s.retired_reason ? `<div>Retired</div><div>${esc(s.retired_reason)}</div>` : ""}
        <div>Directory</div><div class="mono">${esc(s.dir)}</div>
      </div>
      ${s.doc_only ? `<div class="muted">Documentation only — nothing to run.</div>` : `<div class="muted">Run it from a terminal: <code>ops run ${esc(s.name)} …</code></div>`}
    </div>
    ${s.examples.length ? `<h2>Examples</h2><table><tbody>${s.examples.map((e) => `<tr><td class="mono">ops run ${esc(s.name)} ${esc(e.args)}</td><td class="muted">${esc(e.note || "")}</td></tr>`).join("")}</tbody></table>` : ""}
    ${scheds.length ? `<h2>On a timer</h2>${scheduleTable(scheds)}` : ""}
    <h2>Recent runs</h2>${runsOf.length ? runTable(runsOf) : `<div class="empty">no runs yet</div>`}
    <h2>Page</h2><div class="card doc">${markdown(s.body)}</div>`;
  clearInterval(timer);
}

function runTable(list) {
  return `<table><thead><tr><th>ID</th><th>Status</th><th>Script</th><th>Started</th><th>Duration</th><th>By</th><th>Args</th></tr></thead><tbody>
    ${list.map((r) => `<tr class="row" onclick="location.hash='#run/${r.id}'"><td class="num">${r.id}</td><td>${status(r.status)}</td><td class="mono">${esc(r.script)}</td>
      <td>${esc(ago(r.started_at))}</td><td>${esc(human(r.duration_ms))}</td><td class="muted">${r.schedule ? `⏱ ${esc(r.schedule)}` : esc(r.initiated_by)}</td><td class="mono muted">${esc(argsCell(r))}</td></tr>`).join("")}
  </tbody></table>`;
}

async function viewRuns() {
  setTab("runs");
  const params = new URLSearchParams(location.hash.split("?")[1] || "");
  const draw = async () => {
    const q = new URLSearchParams({ limit: "100" });
    for (const k of ["script", "status", "schedule"]) if (params.get(k)) q.set(k, params.get(k));
    const list = await api(`/api/runs?${q}`);
    const body = list.length ? runTable(list) : `<div class="empty">no runs match</div>`;
    const tb = $("#runs-body");
    if (tb) tb.innerHTML = body;
    else main.innerHTML = `<div class="toolbar">
        <input id="f-script" placeholder="script contains…" value="${esc(params.get("script") || "")}">
        <select id="f-status"><option value="">any status</option>${["running", "completed", "failed", "cancelled", "interrupted"].map((s) => `<option ${params.get("status") === s ? "selected" : ""}>${s}</option>`).join("")}</select>
        <input id="f-schedule" placeholder="schedule…" value="${esc(params.get("schedule") || "")}">
        <span class="muted">newest 100 · refreshes every 5s</span></div><div id="runs-body">${body}</div>`;
    for (const k of ["script", "status", "schedule"]) {
      $(`#f-${k}`).onchange = (e) => {
        const p = new URLSearchParams(location.hash.split("?")[1] || "");
        if (e.target.value) p.set(k, e.target.value); else p.delete(k);
        location.hash = `#runs${p.toString() ? "?" + p : ""}`;
      };
    }
  };
  await draw();
  poll(draw, 5000);
}

async function viewRun(id) {
  setTab("runs");
  const draw = async () => {
    const r = await api(`/api/runs/${id}`);
    let log = null;
    try { log = await api(`/api/runs/${id}/log`); } catch (e) { log = null; }
    const confirmed = confirmedIn(log);
    main.innerHTML = `<div class="crumb"><a href="#runs">Runs</a> / ${r.id}</div>
      <div class="card">
        <h3>run ${r.id} ${status(r.status)} <span class="muted">${r.exit_code === null ? "" : `(exit ${r.exit_code}${r.signal ? `, ${esc(r.signal)}` : ""})`}</span></h3>
        <div class="kv">
          <div>Script</div><div class="mono"><a href="#script/${esc(r.script)}">${esc(r.label || r.script)}</a></div>
          <div>Tier</div><div>${esc(r.tier || "—")} · ${esc(r.env)} · ${esc(r.access)}</div>
          <div>Args</div><div class="mono">${esc((r.args || []).join(" ")) || '<span class="muted">none</span>'}</div>
          <div>Params</div><div class="mono">${esc(Object.entries(r.params || {}).map(([k, v]) => `${k}=${v}`).join(" ")) || '<span class="muted">none</span>'}</div>
          ${r.secrets?.length ? `<div>Secrets</div><div class="mono">${esc(r.secrets.join(", "))} <span class="muted">(names only)</span></div>` : ""}
          <div>Started</div><div>${esc(r.started_at)} (${esc(ago(r.started_at))})</div>
          <div>Duration</div><div>${esc(human(r.duration_ms))}</div>
          <div>By</div><div>${esc(r.initiated_by)}${r.schedule ? ` · schedule <a href="#schedule/${esc(r.schedule)}">${esc(r.schedule)}</a>` : ""}</div>
          ${r.rerun_of ? `<div>Rerun of</div><div><a href="#run/${r.rerun_of}">${r.rerun_of}</a></div>` : ""}
          <div>Directory</div><div class="mono">${esc(r.cwd)}</div>
          <div>Log</div><div class="mono">${r.log ? `${esc(r.log)} (${esc(r.captured)})` : '<span class="muted">not captured</span>'}</div>
          ${confirmed !== null ? `<div>Confirmed</div><div><strong>${confirmed}</strong> record(s)</div>` : ""}
        </div>
        <div class="actions">
          ${r.status === "running" ? `<button class="danger" onclick="act('/api/runs/${r.id}/cancel','POST')">stop it (ops task cancel ${r.id})</button>` : ""}
          <span class="muted mono">ops task rerun ${r.id}</span>
        </div>
      </div>
      <h2>Log</h2>${log === null ? `<div class="empty">no captured log</div>` : `<pre class="log">${esc(log)}</pre>`}`;
    if (r.status !== "running") clearInterval(timer);
  };
  await draw();
  poll(draw, 2000);
}

function scheduleTable(list) {
  return `<table><thead><tr><th>Name</th><th>Runs</th><th>When</th><th>Timer</th><th>Last run</th><th>Command</th></tr></thead><tbody>
    ${list.map((s) => `<tr class="row" onclick="location.hash='#schedule/${esc(s.name)}'"><td class="mono">${esc(s.name)}</td><td>${esc(s.script)} ${esc(s.args.join(" "))}</td><td>${esc(s.when)}</td>
      <td>${s.loaded ? '<span class="ok">loaded</span>' : '<span class="bad">not loaded</span>'}</td>
      <td>${s.last_run ? `${status(s.last_run.status)} <span class="muted">${esc(ago(s.last_run.started_at))}</span>` : '<span class="muted">never</span>'}</td>
      <td class="mono muted">${esc(s.backend)}</td></tr>`).join("")}
  </tbody></table>`;
}

function spark(runsOf) {
  const bars = runsOf.slice(0, 24).reverse().map((r) => `<i class="${STATUS_CLS[r.status] || ""}" style="height:${r.status === "completed" ? 14 : 8}px;background:currentColor" title="run ${r.id} ${r.status} ${ago(r.started_at)}"></i>`);
  return `<span class="spark">${bars.join("")}</span>`;
}

async function viewSchedules() {
  setTab("schedules");
  const draw = async () => {
    const list = await api("/api/schedules");
    const allRuns = await api("/api/runs?limit=500");
    if (!list.length) { main.innerHTML = `<div class="empty">nothing on a timer — <code>ops schedule add --every 5h &lt;script&gt; …</code></div>`; return; }
    main.innerHTML = `<div class="toolbar"><span class="muted">refreshes every 10s</span></div><div class="cards">${list.map((s) => {
      const mine = allRuns.filter((r) => r.schedule === s.name);
      const failed = mine.filter((r) => r.status === "failed").length;
      let streak = 0;
      for (const r of mine) { if (r.status === "failed") streak++; else break; }
      return `<div class="card">
        <h3><a href="#schedule/${esc(s.name)}" class="mono">${esc(s.name)}</a> ${s.loaded ? '<span class="pill ok">loaded</span>' : '<span class="pill bad">not loaded</span>'}</h3>
        <div class="cmd">ops run ${esc(s.script)} ${esc(s.args.join(" "))}</div>
        <div class="kv">
          <div>When</div><div>${esc(s.when)} <span class="muted">· ${esc(s.backend)}</span></div>
          <div>Last run</div><div>${s.last_run ? `<a href="#run/${s.last_run.id}">${s.last_run.id}</a> ${status(s.last_run.status)} <span class="muted">${esc(ago(s.last_run.started_at))}</span>` : '<span class="muted">never</span>'}</div>
          <div>History</div><div>${mine.length ? `${spark(mine)} <span class="muted">${mine.length} run(s), ${failed} failed${streak > 1 ? `, <span class="bad">${streak} in a row</span>` : ""}</span>` : '<span class="muted">—</span>'}</div>
        </div>
        <div class="actions">
          <button onclick="act('/api/schedules/${esc(s.name)}/run','POST')">fire now</button>
          <button class="danger" onclick="confirm('Remove ${esc(s.name)} from the timer? Its runs stay.') && act('/api/schedules/${esc(s.name)}','DELETE')">remove</button>
        </div></div>`;
    }).join("")}</div>`;
  };
  await draw();
  poll(draw, 10000);
}

async function viewSchedule(name) {
  setTab("schedules");
  const draw = async () => {
    const s = await api(`/api/schedules/${encodeURIComponent(name)}`);
    const mine = await api(`/api/runs?schedule=${encodeURIComponent(name)}&limit=100`);
    let tlog = null;
    try { tlog = await api(`/api/schedules/${encodeURIComponent(name)}/log`); } catch (e) { tlog = null; }
    if (tlog !== null && !tlog.trim()) tlog = null; // launchd makes the file on load; empty is "not yet"
    // Each firing's confirmed count comes from its own log; a handful of fetches is fine for a page.
    const counts = await Promise.all(mine.slice(0, 20).map(async (r) => { try { return confirmedIn(await api(`/api/runs/${r.id}/log`)); } catch (e) { return null; } }));
    main.innerHTML = `<div class="crumb"><a href="#schedules">Schedules</a> / ${esc(name)}</div>
      <div class="card">
        <h3><span class="mono">${esc(s.name)}</span> ${s.loaded ? '<span class="pill ok">loaded</span>' : '<span class="pill bad">not loaded</span>'}</h3>
        <div class="kv">
          <div>Runs</div><div class="mono"><a href="#script/${esc(s.script.split("/")[0])}">${esc(s.script)}</a> ${esc(s.args.join(" "))}</div>
          ${Object.keys(s.params || {}).length ? `<div>Params</div><div class="mono">${esc(Object.entries(s.params).map(([k, v]) => `${k}=${v}`).join(" "))}</div>` : ""}
          <div>When</div><div>${esc(s.when)} <span class="muted">· ${esc(s.backend)}</span></div>
          <div>Directory</div><div class="mono">${esc(s.cwd)}</div>
          <div>Created</div><div>${esc(s.created_at)} (${esc(ago(s.created_at))}) by ${esc(s.created_by)}</div>
          <div>Timer log</div><div class="mono">${esc(s.log)}</div>
          ${s.installed && s.backend === "launchd" ? `<div>Agent</div><div class="mono">${esc(s.installed)}</div>` : ""}
        </div>
        <div class="actions">
          <button onclick="act('/api/schedules/${esc(s.name)}/run','POST')">fire now</button>
          <button class="danger" onclick="confirm('Remove ${esc(s.name)} from the timer? Its runs stay.') && act('/api/schedules/${esc(s.name)}','DELETE', '#schedules')">remove</button>
          <span class="muted mono">ops schedule get ${esc(s.name)} --rendered</span>
        </div>
      </div>
      <h2>Firings</h2>${mine.length ? `<table><thead><tr><th>ID</th><th>Status</th><th>Started</th><th>Duration</th><th>Confirmed</th></tr></thead><tbody>
        ${mine.map((r, i) => `<tr class="row" onclick="location.hash='#run/${r.id}'"><td class="num">${r.id}</td><td>${status(r.status)}</td><td>${esc(ago(r.started_at))}</td><td>${esc(human(r.duration_ms))}</td><td class="num">${counts[i] ?? '<span class="muted">—</span>'}</td></tr>`).join("")}
      </tbody></table>` : `<div class="empty">it has not fired yet</div>`}
      <h2>Timer log</h2>${tlog === null ? `<div class="empty">nothing yet</div>` : `<pre class="log">${esc(tlog.split("\n").slice(-200).join("\n"))}</pre>`}`;
  };
  await draw();
  poll(draw, 10000);
}

async function act(path, method, goto) {
  try {
    const r = await api(path, { method });
    toast(r.message || "done", "ok");
    if (goto) location.hash = goto;
    else route();
  } catch (e) {
    toast(e.message, "bad");
  }
}

async function route() {
  const h = location.hash.replace(/^#/, "") || "scripts";
  const [head, ...rest] = h.split("/");
  const arg = decodeURIComponent(rest.join("/").split("?")[0]);
  try {
    if (head === "script" && arg) return await viewScript(arg);
    if (head.startsWith("runs")) return await viewRuns();
    if (head === "run" && arg) return await viewRun(arg);
    if (head === "schedules") return await viewSchedules();
    if (head === "schedule" && arg) return await viewSchedule(arg);
    return await viewScripts();
  } catch (e) {
    main.innerHTML = `<div class="empty bad">${esc(e.message)}</div>`;
    clearInterval(timer);
  }
}

async function heartbeat() {
  try {
    const o = await api("/api/overview");
    $("#root").textContent = o.catalogue.root;
    const running = o.runs.filter((r) => r.status === "running").length;
    $("#status").textContent = `${o.schedules.length} timer(s) · ${running ? `${running} running · ` : ""}${o.backend} · state ${o.state_dir}`;
  } catch (e) {
    $("#status").innerHTML = `<span class="bad">ops serve is not answering</span>`;
  }
}

window.addEventListener("hashchange", route);
route();
heartbeat();
setInterval(heartbeat, 15000);
</script>
</body>
